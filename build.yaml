targetAbi: "10.12.0.0"
framework: "net10.0"
overview: "Force-transcode video codecs per user and device"
description: >
  Force Transcode lets you create profiles that pair a Jellyfin user with a
  set of devices. When that user plays video on a listed device, the selected
  source codecs (e.g. HEVC, AV1, VP9) are intercepted and force-transcoded to
  the configured target codec (e.g. H.264) instead of being direct-played or
  remuxed. Useful for devices that claim codec support in their profile but
  cannot actually decode certain streams.
category: "General"
owner: "denisgabriel5"
