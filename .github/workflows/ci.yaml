name: 'CI / CD'

on:
  push:
    branches: [ master, main ]
    tags:     [ 'v*.*.*.*' ]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [ master, main ]
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for manual release (e.g. v0.1.0.0). Leave blank to only build/test.'
        required: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Checkout Jellyfin source
        run: |
          JELLYFIN_PATH="$(cd "$GITHUB_WORKSPACE/.." && pwd)/jellyfin"
          git clone --depth 1 --branch v10.11.8 https://github.com/jellyfin/jellyfin.git "$JELLYFIN_PATH"

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.ForceTranscode.sln

      - name: Build plugin (Release)
        run: |
          dotnet build Jellyfin.Plugin.ForceTranscode/Jellyfin.Plugin.ForceTranscode.csproj \
            -c Release --no-restore

      - name: Verify DLL was produced
        run: |
          test -f Jellyfin.Plugin.ForceTranscode/bin/Release/net*/Jellyfin.Plugin.ForceTranscode.dll
          echo "DLL found"

      - name: Build test project
        run: |
          dotnet build Jellyfin.Plugin.ForceTranscode.Tests/Jellyfin.Plugin.ForceTranscode.Tests.csproj \
            --no-restore

      - name: Run unit tests
        run: |
          dotnet test Jellyfin.Plugin.ForceTranscode.Tests/ \
            --no-build --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout Jellyfin source
        run: |
          JELLYFIN_PATH="$(cd "$GITHUB_WORKSPACE/.." && pwd)/jellyfin"
          git clone --depth 1 --branch v10.11.8 https://github.com/jellyfin/jellyfin.git "$JELLYFIN_PATH"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Release
        run: |
          dotnet publish Jellyfin.Plugin.ForceTranscode/Jellyfin.Plugin.ForceTranscode.csproj \
            -c Release \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -o ./publish

      - name: Package into zip
        run: zip -j ./publish/Jellyfin.Plugin.ForceTranscode.zip ./publish/Jellyfin.Plugin.ForceTranscode.dll

      - name: Compute checksum
        id: checksum
        run: |
          MD5=$(md5sum ./publish/Jellyfin.Plugin.ForceTranscode.zip | awk '{print $1}')
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        env:
          VERSION:   ${{ steps.ver.outputs.version }}
          TAG:       ${{ steps.ver.outputs.tag }}
          CHECKSUM:  ${{ steps.checksum.outputs.md5 }}
          REPO:      ${{ github.repository }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp || '2026-01-01T00:00:00Z' }}
        run: |
          python3 - <<'EOF'
          import json, os

          version   = os.environ['VERSION']
          tag       = os.environ['TAG']
          checksum  = os.environ['CHECKSUM']
          repo      = os.environ['REPO']
          timestamp = os.environ['TIMESTAMP']

          manifest_url = f"https://raw.githubusercontent.com/{repo}/master/manifest.json"
          source_url   = f"https://github.com/{repo}/releases/download/{tag}/Jellyfin.Plugin.ForceTranscode.zip"

          with open('manifest.json') as f:
              data = json.load(f)

          entry = {
              "version":        version,
              "VersionNumber":  version,
              "changelog":      f"Release {version}.",
              "targetAbi":      data[0]["versions"][0]["targetAbi"] if data[0]["versions"] else "10.11.8.0",
              "sourceUrl":      source_url,
              "checksum":       checksum,
              "timestamp":      timestamp,
              "repositoryName": data[0]["name"],
              "repositoryUrl":  manifest_url,
          }

          data[0]["versions"] = [v for v in data[0]["versions"] if v["version"] != version]
          data[0]["versions"].insert(0, entry)
          data[0]["versions"] = data[0]["versions"][:10]

          with open('manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          EOF

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git rebase --autostash origin/master
          git add manifest.json
          git diff --cached --quiet || git commit -m "chore: update manifest.json for ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Force Transcoding ${{ steps.ver.outputs.tag }}
          body: |
            ## Installation

            Add this URL as a custom repository in **Dashboard → Plugins → Repositories**:

            ```
            https://raw.githubusercontent.com/${{ github.repository }}/master/manifest.json
            ```

            Then install **Force Transcoding** from the catalogue.
          files: ./publish/Jellyfin.Plugin.ForceTranscode.zip
